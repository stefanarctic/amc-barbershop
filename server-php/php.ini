; ============================================================
; php.ini întărit pentru frizeria AMC — folosit cu:
;   php -c server-php/php.ini -S 0.0.0.0:8462 -t la-macrea server-php/router.php
;
; Obiectiv: chiar dacă cineva ar reuși să plaseze/execute cod PHP neintenționat,
; limbajul are capetele legate (fără procese, fără URL-uri remote, fără upload).
; ============================================================

[Extensions]
; PDO SQLite pentru DB-ul de programări (pachetul php-sqlite)
extension=pdo_sqlite
extension=sqlite3

[Security]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = ${DATA_DIR}/php-errors.log
; totul rămâne sub directorul proiectului — un script compromis nu poate citi/scrie în sistem
; NU includem server/ (vechiul backend Node conține config.json cu secretul de hashing —
; nu trebuie să fie citibil de codul web). migrate.php rulează o singură dată, cu override CLI:
;   php -c server-php/php.ini -d open_basedir= server-php/bin/migrate.php
open_basedir = ${PROJECT_DIR}/server-php:${PROJECT_DIR}/la-macrea
allow_url_fopen = Off
allow_url_include = Off
; fără upload de fișiere = principalul vector de webshell este închis din rădăcină
file_uploads = Off
upload_max_filesize = 0
max_file_uploads = 0
; fără execuție de procese / modificare de runtime — blochează reverse shells & co.
; (eval nu poate fi dezactivat prin ini — e construct de limbaj — dar codul aplicației nu îl folosește)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,dl
; session hardening
; sesiunile trăiesc în server-php/data/sessions — în interiorul open_basedir
; (altfel PHP ar vrea /tmp și session_start() eșuează)
session.save_path = "${DATA_DIR}/sessions"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
; session.entropy_file/length au fost eliminate din PHP 7.1+ — entropia e implicită
session.gc_maxlifetime = 28800
session.cookie_lifetime = 0

[Performance]
opcache.enable = 0
memory_limit = 128M
max_execution_time = 30
